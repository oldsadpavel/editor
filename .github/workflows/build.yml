name: build

# Builds run locally (npm run dist / install-local). CI build only on demand: Actions → build → Run workflow,
# or when a v* tag is pushed (to attach installers to a GitHub release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable
            artifact: release/*.exe
          - os: macos-latest
            target: --mac zip --arm64 --x64
            artifact: release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: /RC pseudo-terminal works on this OS
        run: node scripts/pty-check.mjs
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: claude-editor-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 30
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          body: |
            Windows: ClaudeEditor-*-portable.exe — запустить, установка не нужна.
            macOS: *-arm64-mac.zip (Apple Silicon) или *-mac.zip (Intel) — распаковать, перенести в Программы.
            Сборка не подписана: при первом запуске правый клик → Открыть, либо в Терминале xattr -cr "/Applications/Claude Editor.app".
            Claude Code редактор предложит установить сам (кнопка «Установить Claude Code»). /RC работает на Windows (нужен Git for Windows) и macOS.
