name: build

# Builds run locally (npm run dist / install-local). CI build only on demand: Actions → build → Run workflow,
# or when a v* tag is pushed (to attach installers to a GitHub release).
on:
  push:
    tags: ['v*', 'mpi-remote-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # mpi-remote-* tags build only the Android app
    if: ${{ !startsWith(github.ref, 'refs/tags/mpi-remote-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable
            artifact: release/*.exe
          - os: macos-latest
            target: --mac zip --arm64 --x64
            artifact: release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: /RC pseudo-terminal works on this OS
        run: node scripts/pty-check.mjs
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: claude-editor-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 30
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          body: |
            Windows: MPI-*-portable.exe — запустить, установка не нужна.
            macOS: *-arm64-mac.zip (Apple Silicon) или *-x64-mac.zip (Intel) — распаковать, перенести в Программы.
            Сборка не подписана: при первом запуске правый клик → Открыть, либо в Терминале xattr -cr "/Applications/MPI.app".
            Claude Code редактор предложит установить сам (кнопка «Установить Claude Code»). /RC работает на Windows (нужен Git for Windows) и macOS (ничего ставить не нужно).

  # MPI Remote — the Android app (src/mobile + Capacitor). Signed with the release key from secrets
  # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD (without them — the debug key, so updates need a reinstall).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build -c vite.mobile.config.ts
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          MPI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          # every build gets a bigger number (the app compares it to update itself); 1000+ — above the first builds (212)
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          export MPI_VERSION_NAME="$VERSION+b$BUILD"
          export MPI_VERSION_CODE=$BUILD
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mpi.jks"; export MPI_KEYSTORE="$RUNNER_TEMP/mpi.jks"; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../release && cp app/build/outputs/apk/release/app-release.apk "../release/MPI-Remote-$VERSION-b$BUILD.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mpi-remote-android
          path: release/*.apk
          retention-days: 30
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
