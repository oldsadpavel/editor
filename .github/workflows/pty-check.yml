name: pty-check

# Quick check of the /RC pseudo-terminal on macOS without a full build. Triggered by a pty-* tag.
on:
  push:
    tags: ['pty-*']
  workflow_dispatch:

jobs:
  pty:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        method: [auto, python, expect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save esbuild@0.28.2
      - run: node scripts/pty-check.mjs
        env:
          CLAUDE_EDITOR_PTY: ${{ matrix.method != 'auto' && matrix.method || '' }}
